CONFIG_UNITY=y
CONFIG_ZBUS=y

# The orchestrator sequences on k_event. Without this the suite fails to link with
# "undefined reference to z_impl_k_event_clear" rather than anything about events.
CONFIG_EVENTS=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# A location_msg is over a kilobyte, and the subscriber pool copies one per message.
CONFIG_HEAP_MEM_POOL_SIZE=80000

# The tests measure step durations against the fake's 50 ms sleeps, so the clock has to be
# the real one. Left at the default the suite would run at simulated speed and the
# durations would be meaningless.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
