#
# Radio-survey data exporter. Rationale for these choices is in REQUIREMENTS.md,
# section "Configuration decisions".
#
# Build with:
#   west build -b thingy91x/nrf9151/ns --sysbuild app -- \
#       -DEXTRA_CONF_FILE=overlay-survey.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=overlay-survey.overlay
#
# The .overlay is not optional: it grows littlefs_storage to 24 MiB, which is what the
# record count below is sized against. Without it the backend asserts at boot.

CONFIG_APP_SURVEY=y

# Explicit, not defaulted on by the LittleFS backend. It replaces the LOCATION storage type
# and raises STORAGE_MAX_DATA_SIZE to 816, which is why the batch buffer and storage thread
# stack further down are what they are. Those three belong in one file, visible together.
CONFIG_APP_SURVEY_STORAGE=y

# Never resolve a position from cell or Wi-Fi data: not built, so it cannot fire.
CONFIG_APP_CLOUD_LOCATION=n

# Never provision. Entering the provisioning state also cancels location searches.
CONFIG_APP_CLOUD_PROVISIONING=n

# One connection attempt per boot rather than hourly. INITIAL must not exceed MAX,
# which cloud.c asserts on.
CONFIG_APP_CLOUD_BACKOFF_TYPE_NONE=y
CONFIG_APP_CLOUD_BACKOFF_INITIAL_SECONDS=604800
CONFIG_APP_CLOUD_BACKOFF_MAX_SECONDS=604800

# Raw GNSS: no assistance, so no nRF Cloud account is needed. Costs time to first fix.
CONFIG_NRF_CLOUD_AGNSS=n

# Keep coredumps in flash for local analysis; never upload them or metrics.
# CONFIG_MEMFAULT_PERIODIC_UPLOAD=n does not link, so disable it at runtime instead.
CONFIG_MEMFAULT_NCS_POST_COREDUMP_ON_NETWORK_CONNECTED=n
CONFIG_MEMFAULT_PERIODIC_UPLOAD_ENABLED_DEFAULT=n

# The asset-tracker samples on its own timer and its results are indistinguishable
# from the survey's on location_chan. One day suppresses the repeats.
#
# It does NOT suppress the sample taken at startup: that still issues one
# GNSS-first location request per boot, observed on target as a cached fix nobody
# asked for. Removing the second driver entirely is FW-7 / CP6 work.
CONFIG_APP_SAMPLING_INTERVAL_SECONDS=86400

# GNSS is the ground truth, so let it finish. Visibility detection otherwise aborts
# after 3 s when fewer than 3 satellites are visible, which makes indoor testing
# impossible. The overall timeout must exceed the GNSS timeout to be reachable.
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_VISIBILITY_DETECTION=n
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_TIMEOUT=600000
CONFIG_LOCATION_REQUEST_DEFAULT_TIMEOUT=660000

# High accuracy, not the template's LOW. LOW sets NRF_MODEM_GNSS_USE_CASE_LOW_ACCURACY,
# letting the modem declare a fix from as few as three satellites -- the likely cause of
# the 58 m first fix seen on target. Ground truth must be better than what it measures,
# and Wi-Fi positioning is claimed at tens of metres, so a 58 m reference cannot assess
# it. HIGH also makes NUM_CONSECUTIVE_FIXES meaningful: method_gnss.c reads it only in
# the HIGH branch. Two is the floor, the symbol's range being [2, 256].
#
# This costs time per fix, which bounds the capture cadence. Measure before settling the
# interval (verification step 5).
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_ACCURACY_HIGH=y
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_NUM_CONSECUTIVE_FIXES=2

# Survey records go to flash, so a capture survives a flat battery or a reset. The
# derivation of 25000 -- and the capture cadence it implies -- is in overlay-survey.overlay.
# It is set by the block budget, not the byte budget: the backend keeps one file per block.
CONFIG_APP_STORAGE_BACKEND_LITTLEFS=y
CONFIG_APP_STORAGE_MAX_RECORDS_PER_TYPE=25000

# Stop rather than overwrite. A survey is a recording collected days later; wrapping would
# discard the beginning of the run and nothing would notice until analysis.
CONFIG_APP_STORAGE_FULL_STOP=y

# Announce as late as possible. The default of 1 makes storage publish
# STORAGE_THRESHOLD_REACHED after every single record, which is the asset tracker's cue to
# start shipping data to the cloud -- the exact behaviour this build exists to avoid.
#
# "Never" is not reachable: update_threshold() rejects anything above
# APP_STORAGE_MAX_RECORDS_PER_TYPE, so the last record still announces once. That is
# harmless only because cloud.c now ends a batch session rather than consuming records it
# has no handler for -- there is no cloud handler for STORAGE_TYPE_SURVEY, and consuming
# would delete the capture. Do not remove that guard.
CONFIG_APP_STORAGE_INITIAL_THRESHOLD=25000

# One survey record is 816 bytes, larger than the location_msg this was sized for. The
# pipe must hold one item plus its header; storage.c BUILD_ASSERTs the exact requirement.
CONFIG_APP_STORAGE_BATCH_BUFFER_SIZE=1024

# The storage thread holds a STORAGE_MAX_DATA_SIZE buffer on its stack in several
# functions, and that size is now the survey slot rather than a location_msg.
CONFIG_APP_STORAGE_THREAD_STACK_SIZE=6144

# Known hazard, deliberately not worked around here: a burst of records can panic the
# device inside zbus.
#
#   ASSERTION FAIL @ zephyr/subsys/zbus/zbus.c:252
#   net_buf zbus_msg_subscribers_pool is unavailable or heap is full
#   <err> os: ***** USAGE FAULT ***** Attempt to execute undefined instruction
#
# zbus copies every message bound for a ZBUS_MSG_SUBSCRIBER into a net_buf, and the
# storage module is one, so every survey record in flight holds a buffer until the storage
# thread retires it. Stores are neither quick nor bounded: LittleFS compacts the record
# directory on append, which is O(entries), and single writes of 14 s and 43.9 s were
# measured on target at a few hundred entries. Outrun the storage thread and the heap behind
# the pool empties; zbus then asserts on the NULL buffer instead of returning an error.
#
# Three fixes were tried on target and all three are worse than the problem:
#
#  - Raising CONFIG_HEAP_MEM_POOL_SIZE only moves the cliff. 32768 still panicked.
#  - CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC makes the allocation blocking, which is
#    the right primitive, but the pool is global: a survey producer that waits then starves
#    power, environmental and location, which publish with PUB_TIMEOUT and so assert in
#    turn. It relocates the panic to a module that did nothing wrong.
#  - CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_ISOLATION would fix that properly, and does
#    not work in NCS 3.4.0 / Zephyr 4.4: zbus.h:307 initialises the per-channel pool under
#    IF_ENABLED(ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_ISOLATION, ...), missing the CONFIG_
#    prefix every other reference in that file has. The token is never defined, so every
#    channel's msg_subscriber_pool stays NULL and the first publish dereferences it.
#    Measured: enabling it boot-loops the device at 0.9 s, before the shell comes up.
#    Fixing it from here means assigning a pool to all 18 channels from application code,
#    which is a large blast radius for a fork that rebases on upstream.
#
# So this build keeps the upstream defaults and contains the problem instead. Note which
# limit actually binds: prj.conf already raises the descriptor pool to 64
# (CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE), but the descriptors are backed by the
# 12288-byte system heap, and an 816-byte message plus net_buf overhead exhausts that at a
# dozen or so in flight -- well before the 64th descriptor. The heap is the ceiling, which
# is also why raising CONFIG_HEAP_MEM_POOL_SIZE only moves it. Normal capture never
# approaches either: one record in flight, 10-30 s apart. It is reachable only by bursting,
# which only the bench command "survey fill" does -- see CONFIG_APP_SURVEY_SHELL_FILL,
# which is n by default and documents how to drive it.
#
# Pacing "survey fill" is not a workaround. The number that has to be outrun grows with the
# directory: 250 ms is fine on a fresh partition and panics in 8 s at 446 entries. Long
# fills have to be driven from the host in bursts of well under a dozen, pacing each batch
# off the cost measured from the previous one -- see docs/common/dev_workflow.md.

# INF, not WRN. `att_storage stats` reports entirely through LOG_INF, so at WRN the command
# acks on the shell and then prints nothing at all -- which is how it behaved on the bench
# until this was measured. Nothing in the storage module logs at INF on the per-record path
# (the chatty lines are DBG); the only INF lines are the mount, the partition-size check, the
# clear, and the stats block itself. Raising this costs no runtime noise and is the difference
# between the record count being observable on target and not.
CONFIG_APP_STORAGE_LOG_LEVEL_INF=y
CONFIG_APP_LOCATION_LOG_LEVEL_INF=y
CONFIG_APP_NETWORK_LOG_LEVEL_INF=y
CONFIG_APP_CLOUD_LOG_LEVEL_WRN=y
CONFIG_APP_POWER_LOG_LEVEL_WRN=y

# Scan 5 GHz as well as 2.4 GHz. The board conf pins CONFIG_NRF_WIFI_2G_BAND to keep scan
# time down; for a survey, missing a whole band biases the highest-value observation.
CONFIG_NRF_WIFI_ALL_BAND=y

# The board conf's 5 s was sized for a 2.4 GHz-only sweep. Dual band adds ~16 DFS channels
# that must be dwelled on passively, and the nRF70 returns results only when the whole sweep
# finishes -- so an overrun yields zero APs, not a short list.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_TIMEOUT=30000

# Do not drop locally-administered BSSIDs; FW-5 forbids pre-filtering on device.
CONFIG_WIFI_NRF70_SKIP_LOCAL_ADMIN_MAC=n
