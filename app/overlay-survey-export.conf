# CP8 / FW-8 -- export over MCUmgr SMP fs_mgmt.
#
# Kept in its own overlay rather than folded into overlay-survey.conf so the cost of the
# export path can be measured against a CP6 build by adding and removing one file, and so a
# field image that has no reason to carry it can leave it out.
#
# Why fs_mgmt rather than a purpose-built batch protocol: the LittleFS backend already stores
# records as a fixed 816-byte stride in files under /att_storage, so a host that can read
# those files byte-for-byte can slice records out of them with arithmetic alone. fs_mgmt's
# download takes an offset, which makes resume a property of the protocol instead of
# something this application has to implement and test. See FW-8 in REQUIREMENTS.md.

CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y

CONFIG_MCUMGR_GRP_FS=y

# Files under /att_storage are at most one erase block (4080 B of records), but the header
# file and any future layout change should not silently fail at the 64 KB boundary. The cost
# is 2 bytes per chunk header.
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y

# CRC32 over a whole file, as a separate command from the download. This is what lets the
# host verify a transfer it resumed across a disconnect without re-reading what it already
# has. SHA256 is deliberately not enabled -- it costs code and the threat here is a dropped
# USB packet, not an adversary.
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_IEEE_CRC32=y

# Reports file size without downloading it, so the host can plan the transfer and show an
# honest progress bar rather than discovering the length as it goes.
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y

# The hook survey_export.c registers to make the whole filesystem read-only and reject any
# path outside /att_storage. Without this, fs_mgmt is an unauthenticated write primitive on
# a device an untrained operator plugs into their laptop.
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y

# "/att_storage/SURVEY_4999.bin" is 27 characters; the default 64 is ample and shrinking it
# saves a stack buffer, not much else. Left at the default deliberately.

# Transport. Two of them, for different audiences:
#
#  - SHELL rides uart0 alongside the existing "survey" commands, base64-framed. This is the
#    transport CP8's note in REQUIREMENTS.md requires the protocol be proven on first,
#    because uart0 is the port every hardware test already uses and is known good.
#  - UART is SMP on uart1, which the board wires to the second CDC port through the nRF5340
#    bridge at 1 Mbaud. This is the shipped path.
#
# Note that UART here is *not* raw framing: MCUMGR_TRANSPORT_UART selects
# MCUMGR_TRANSPORT_SERIAL_HAS_SMP_OVER_CONSOLE, so it carries the same base64-and-CRC16
# console encoding the shell transport does. The win over the shell is the dedicated port and
# the baud, not the framing -- uart1 has no log output or prompt interleaved with the
# responses, so the client never has to tell an SMP frame from a banner. Keeping the framing
# identical is deliberate: one encoder in survey_smp.py and one in the browser client serve
# both transports. MCUMGR_TRANSPORT_RAW_UART would drop the base64 for ~33 % more payload per
# frame, at the cost of a second framing to implement and test on both hosts. Not worth it
# until the transfer is measured and the framing is what limits it.
#
# Both transports are enabled at once on purpose: the browser probes for whichever answers,
# which is how a non-technical operator avoids having to know which /dev/cu.usbmodem* is
# which, and a failure on one is diagnosable from the other.
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# MCUMGR_TRANSPORT_UART depends on this driver symbol, which nothing else in the build turns
# on. Without it the transport silently drops out of the configuration -- the build succeeds,
# the devicetree chosen node still points at uart1, and the port simply never answers. Found
# exactly that way; see docs/common/dev_workflow.md. Confirm it in the generated .config
# rather than trusting this line.
CONFIG_UART_MCUMGR=y

# Chunk size follows the netbuf, so this sets the transfer rate as much as the baud does.
# 1280 keeps a whole 4080-byte data file to four round trips instead of sixteen at the
# 256 B default.
#
# The count is the RAM knob and the size is the speed knob, and this build has little RAM to
# spend -- CP6 already sits at 87.03 %. Measured, as a percentage of the 244,504-byte region:
#
#   netbuf size x count      RAM        delta vs CP6
#   2048 x 4              91.72 %           +4.69 pp   (~11.5 kB)
#   1024 x 2              89.18 %           +2.15 pp   (~5.3 kB)
#
# 1280 x 2 splits the difference: measured real-hardware download throughput (~16 kB/s,
# flat across file index) showed the transfer is not bottlenecked on round trips at this
# size, so there was nothing to buy by spending the RAM on 2048. Going wider costs RAM the
# capture path needs more than the export path does; export is a once-a-week operation,
# capture runs forever.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1280
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_TRANSPORT_SHELL_MTU=1280
CONFIG_MCUMGR_TRANSPORT_UART_MTU=1280

# The download chunk is decoupled from the netbuf on purpose, and this is not a tuning
# preference -- it is a crash fix.
#
# fs_mgmt_file_download() declares `uint8_t file_data[MCUMGR_GRP_FS_DL_CHUNK_SIZE]` as a
# *stack* array (zephyr/subsys/mgmt/mcumgr/grp/fs_mgmt/src/fs_mgmt.c:245), and that chunk size
# defaults to the netbuf size. Left at 2048 it puts a 2 KB frame on the 2048-byte MCUmgr
# workqueue stack, which overflows. The symptom is not an error: `fs status` keeps working
# (it allocates nothing large) while every download request gets **no response at all**, on
# both transports. Diagnosed only by reading the handler.
#
# So the chunk is set explicitly, and the stacks below are sized against it rather than
# against the default.
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE_LIMIT=y
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE=1024

# Chunk (1024) plus the handler's own frame, the CBOR encoder and the filesystem call
# underneath it. 4096 leaves roughly 3 KB of margin over the chunk; the failure mode being
# guarded against is silent, so the margin is deliberately generous rather than measured to
# the byte. Both stacks matter because both transports reach the same handler: the UART
# transport runs it on the MCUmgr workqueue, the shell transport on the shell thread.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096

# Turn the next overflow into a fault that names the thread instead of a device that answers
# some commands and ignores others.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
